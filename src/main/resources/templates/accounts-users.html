<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>User Control</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>User Control</h2>

        <a href="/accounts"
           class="btn btn-secondary">
            Back
        </a>

    </div>


    <!-- CREATE USER -->

    <div class="card mb-4">

        <div class="card-header">
            <strong>Create User</strong>
        </div>

        <div class="card-body">

            <form
                action="/accounts/users/create"
                method="post"
                class="row g-3">

                <div class="col-md-5">

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Username"
                        required>

                </div>

                <div class="col-md-5">

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        required>

                </div>

                <div class="col-md-2">

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Create
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- USERS TABLE -->

    <div class="card">

        <div class="card-header">
            <strong>Users</strong>
        </div>

        <div class="card-body p-0">

            <table class="table table-bordered mb-0">

                <thead>

                <tr>
                    <th>Username</th>
                    <th>Status</th>
                    <th>Control</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="user : ${users}">

                    <td th:text="${user.username}">
                        Username
                    </td>

                    <td>

                        <span
                            th:if="${user.active}"
                            class="badge bg-success">
                            Active
                        </span>

                        <span
                            th:unless="${user.active}"
                            class="badge bg-danger">
                            Disabled
                        </span>

                    </td>

                    <td>

                        <span
                            th:if="${user.owner}"
                            class="badge bg-primary">
                            Owner
                        </span>


                        <div th:unless="${user.owner}">

                            <form
                                action="/accounts/users/toggle"
                                method="post"
                                style="display:inline;">

                                <input
                                    type="hidden"
                                    name="id"
                                    th:value="${user.id}">

                                <button
                                    type="submit"
                                    class="btn btn-warning btn-sm">

                                    <span
                                        th:if="${user.active}">
                                        Disable
                                    </span>

                                    <span
                                        th:unless="${user.active}">
                                        Enable
                                    </span>

                                </button>

                            </form>


                            <form
                                action="/accounts/users/delete"
                                method="post"
                                style="display:inline;"
                                onsubmit="return confirm('Delete this user?');">

                                <input
                                    type="hidden"
                                    name="id"
                                    th:value="${user.id}">

                                <button
                                    type="submit"
                                    class="btn btn-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
