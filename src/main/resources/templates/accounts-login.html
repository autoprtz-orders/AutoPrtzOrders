<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoPrtz - Accounts Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .login-header {
            background: #212529;
            color: white;
            padding: 25px;
            border-radius: 18px 18px 0 0;
        }

        .login-body {
            padding: 30px;
        }

        .form-control {
            min-height: 48px;
        }

        .login-btn {
            min-height: 48px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card login-card">

    <div class="login-header">

        <h3 class="mb-1">
            AutoPrtz
        </h3>

        <div class="text-white-50">
            Accounts Login
        </div>

    </div>


    <div class="login-body">

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
            Invalid username or password.
        </div>


        <form action="/accounts/login"
              method="post">


            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    autocomplete="username"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-dark w-100 login-btn">

                Login

            </button>

        </form>

    </div>

</div>

</body>

</html>
