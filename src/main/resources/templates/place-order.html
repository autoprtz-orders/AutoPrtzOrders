<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>AutoPrtz Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">AutoPrtz Customer Order</h2>

        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/saveOrder}" th:object="${order}" method="post">

            <div class="mb-3">
                <label class="form-label">Order Number</label>
                <input type="text" class="form-control"
                       th:field="*{orderNumber}" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">Customer Name</label>
                <input type="text" class="form-control"
                       th:field="*{customerName}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Origin</label>
                <input type="text" class="form-control"
                       th:field="*{origin}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Receiver Name</label>
                <input type="text" class="form-control"
                       th:field="*{receiverName}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control"
                       th:field="*{phoneNumber}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control"
                       th:field="*{location}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Part Details</label>
                <input type="text" class="form-control"
                       th:field="*{partDetails}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control"
                          rows="4"
                          th:field="*{description}"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Submit Order
            </button>

        </form>

    </div>

</div>

</body>
</html>
