<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoPrtz - Owner Setup</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setup-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .setup-header {
            background: #212529;
            color: white;
            padding: 25px;
            border-radius: 18px 18px 0 0;
        }

        .setup-body {
            padding: 30px;
        }

        .form-control {
            min-height: 48px;
        }

        .setup-btn {
            min-height: 48px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card setup-card">

    <div class="setup-header">

        <h3 class="mb-1">
            AutoPrtz
        </h3>

        <div class="text-white-50">
            Owner Account Setup
        </div>

    </div>


    <div class="setup-body">

        <div class="alert alert-info">

            Create the main owner account.
            Keep your password and security PIN private.

        </div>


        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>


        <form action="/accounts/setup"
              method="post">


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Owner Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter owner username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <!-- SECURITY PIN -->

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Security PIN
                </label>

                <input
                    type="password"
                    name="securityPin"
                    class="form-control"
                    placeholder="Enter security PIN"
                    required>

                <div class="form-text">
                    This PIN will be required for sensitive
                    account/security changes.
                </div>

            </div>


            <button
                type="submit"
                class="btn btn-dark w-100 setup-btn">

                Create Owner Account

            </button>

        </form>

    </div>

</div>

</body>

</html>
